<!-- @dsCard group="Components" name="Vinyl hero — Now Playing" -->
<style>
:root{--bg:#0D0B09;--raised:#17130F;--sunken:#070605;--border:#2B241D;--text:#F6EFE3;--dim:#AFA28D;--faint:#6E6355;--gold:#F5A623;--gold-soft:rgba(245,166,35,.14);--onair:#FF3B30;--fire:#FF6B2C;--slop:#9D6BFF;--phosphor:#35E08A;--vinyl:#0A0908;--groove:#221C16;--mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:32px;display:flex;justify-content:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:460px}
.pills{display:flex;gap:8px}
.onair{display:flex;align-items:center;gap:7px;border:1px solid var(--onair);background:rgba(255,59,48,.13);padding:7px 16px;border-radius:999px}
.onair i{width:8px;height:8px;border-radius:50%;background:var(--onair);animation:pulse 2s ease-in-out infinite;box-shadow:0 0 12px rgba(255,59,48,.7)}
@keyframes pulse{50%{opacity:.5}}
.onair b{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--onair)}
.tele{display:flex;align-items:center;background:var(--raised);border:1px solid var(--border);padding:7px 16px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--phosphor)}
.stage{position:relative;width:340px;height:340px;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.38),transparent 70%);filter:blur(28px)}
.record{position:relative;width:320px;height:320px;border-radius:50%;background:var(--vinyl);border:1px solid var(--groove);display:flex;align-items:center;justify-content:center;animation:rpm33 1.8s linear infinite}
@keyframes rpm33{to{transform:rotate(360deg)}}
.g{position:absolute;border-radius:50%;border:1px solid var(--groove)}
.art{width:198px;height:198px;border-radius:50%;overflow:hidden;background:conic-gradient(from 200deg,#F5A623,#FF6B2C,#9D6BFF,#17130F,#F5A623);display:flex;align-items:center;justify-content:center}
.spindle{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--sunken);border:2px solid var(--gold)}
.tt{font-size:40px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;text-align:center}
.ar{font-size:19px;font-weight:800;color:var(--dim)}
.prog{width:340px}
.bar{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:4px;width:47%;background:var(--gold)}
.tc{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--phosphor)}
.tc span:last-child{color:var(--faint)}
.votes{display:flex;align-items:center;gap:14px}
.v{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;border:1px solid;font-weight:800;font-size:15px}
.vf{border-color:var(--fire);background:rgba(255,107,44,.12);color:var(--fire)}
.vs{border-color:var(--slop);background:rgba(157,107,255,.12);color:var(--slop)}
.tug{display:flex;width:120px;height:8px;border-radius:4px;overflow:hidden;background:var(--raised)}
.tug i{display:block}
.cta{background:var(--gold);color:var(--sunken);font-weight:800;font-size:15px;padding:12px 26px;border-radius:999px;box-shadow:0 0 30px rgba(245,166,35,.35)}
</style>
<div class="hero">
  <div class="pills">
    <div class="onair"><i></i><b>ON AIR</b></div>
    <div class="tele">TOTS•01 · 26 IN THE ROOM</div>
  </div>
  <div class="stage">
    <div class="glow"></div>
    <div class="record">
      <div class="g" style="inset:5%"></div><div class="g" style="inset:12%"></div><div class="g" style="inset:19%"></div>
      <div class="art"></div>
      <div class="spindle"></div>
    </div>
  </div>
  <div class="tt">Banger Protocol</div>
  <div class="ar">VJAI &amp; The Countdown</div>
  <div class="prog">
    <div class="bar"><i></i></div>
    <div class="tc"><span>00:14 / 00:30</span><span>NEXT · AUTO</span></div>
  </div>
  <div class="votes">
    <div class="v vf">🔥 12</div>
    <div class="tug"><i style="flex:12;background:var(--fire)"></i><i style="flex:4;background:var(--slop)"></i></div>
    <div class="v vs">💩 4</div>
  </div>
  <div class="cta">▶ Tap to tune in</div>
</div>
